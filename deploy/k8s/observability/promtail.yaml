apiVersion: v1
kind: ServiceAccount
metadata: {name: promtail, namespace: pulseops-observability}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: pulseops-promtail}
rules:
  - apiGroups: [""]
    resources: [pods, nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: pulseops-promtail}
subjects: [{kind: ServiceAccount, name: promtail, namespace: pulseops-observability}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: pulseops-promtail}
---
# One per node: tails the container log files kubelet writes under
# /var/log/pods and ships them to Loki.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: pulseops-observability
  labels: {app.kubernetes.io/name: promtail}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: promtail}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: promtail}
    spec:
      serviceAccountName: promtail
      containers:
        - name: promtail
          image: grafana/promtail:3.1.1
          args: [-config.file=/etc/promtail/promtail.yml]
          env:
            - name: HOSTNAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            # root only to read node-owned log files; read-only everywhere
            runAsUser: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL], add: [DAC_READ_SEARCH]}
          volumeMounts:
            - {name: config, mountPath: /etc/promtail}
            - {name: pods, mountPath: /var/log/pods, readOnly: true}
            - {name: positions, mountPath: /run/promtail}
      volumes:
        - name: config
          configMap: {name: promtail-config}
        - name: pods
          hostPath: {path: /var/log/pods}
        - {name: positions, emptyDir: {}}
