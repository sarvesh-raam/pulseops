apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: pulseops-observability
  labels: {app.kubernetes.io/name: loki}
spec:
  selector: {app.kubernetes.io/name: loki}
  ports: [{name: http, port: 3100, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: pulseops-observability
  labels: {app.kubernetes.io/name: loki}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: loki}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: loki}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: loki
          image: grafana/loki:3.1.1
          args: [-config.file=/etc/loki/loki.yml]
          ports: [{name: http, containerPort: 3100}]
          readinessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 5, initialDelaySeconds: 10}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: config, mountPath: /etc/loki}
            - {name: data, mountPath: /loki}
      volumes:
        - name: config
          configMap: {name: loki-config}
        - {name: data, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: pulseops-observability
  labels: {app.kubernetes.io/name: jaeger}
spec:
  selector: {app.kubernetes.io/name: jaeger}
  ports:
    - {name: ui, port: 16686, targetPort: ui}
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: pulseops-observability
  labels: {app.kubernetes.io/name: jaeger}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: jaeger}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: jaeger}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.60
          env:
            - {name: COLLECTOR_OTLP_ENABLED, value: "true"}
            - {name: MEMORY_MAX_TRACES, value: "50000"}
          ports:
            - {name: ui, containerPort: 16686}
            - {name: otlp-http, containerPort: 4318}
          readinessProbe: {httpGet: {path: /, port: 14269}, periodSeconds: 5}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 768Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
