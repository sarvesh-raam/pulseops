apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: pulseops-observability
  labels: {app.kubernetes.io/name: alertmanager}
spec:
  selector: {app.kubernetes.io/name: alertmanager}
  ports: [{name: http, port: 9093, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: pulseops-observability
  labels: {app.kubernetes.io/name: alertmanager}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: alertmanager}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: alertmanager}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65534, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args: [--config.file=/etc/alertmanager/alertmanager.yml, --storage.path=/alertmanager]
          ports: [{name: http, containerPort: 9093}]
          readinessProbe: {httpGet: {path: /-/ready, port: http}, periodSeconds: 5}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: config, mountPath: /etc/alertmanager}
            - {name: data, mountPath: /alertmanager}
      volumes:
        - name: config
          configMap: {name: alertmanager-config}
        - {name: data, emptyDir: {}}
