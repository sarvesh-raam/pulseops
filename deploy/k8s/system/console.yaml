apiVersion: v1
kind: Service
metadata:
  name: console
  namespace: pulseops-system
  labels: {app.kubernetes.io/name: console, app.kubernetes.io/part-of: pulseops-platform}
spec:
  selector: {app.kubernetes.io/name: console}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  namespace: pulseops-system
  labels: {app.kubernetes.io/name: console, app.kubernetes.io/part-of: pulseops-platform}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: console}
  template:
    metadata:
      labels: {app.kubernetes.io/name: console, app.kubernetes.io/part-of: pulseops-platform}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: console
          image: pulseops/console
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /nginx-health, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /nginx-health, port: http}, periodSeconds: 10}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            # nginx resolves upstreams by short name; in-cluster they live in
            # other namespaces, so point the names at full service DNS
            - {name: nginx-conf, mountPath: /etc/nginx/conf.d}
      volumes:
        - {name: tmp, emptyDir: {}}
        - name: nginx-conf
          configMap: {name: console-nginx}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: console-nginx
  namespace: pulseops-system
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        location = /nginx-health { access_log off; default_type text/plain; return 200 "ok\n"; }
        location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
        location /api/ {
            proxy_pass http://controlplane.pulseops-system.svc.cluster.local:8000;
            proxy_read_timeout 30s;
        }
        location /shop/ {
            proxy_pass http://gateway.pulseops.svc.cluster.local:8000/;
            proxy_read_timeout 30s;
        }
        location / { add_header Cache-Control "no-cache"; try_files $uri /index.html; }
    }
