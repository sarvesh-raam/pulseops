apiVersion: v1
kind: ServiceAccount
metadata:
  name: controlplane
  namespace: pulseops-system
---
# The chaos engine's only powers: see and delete pods, read replica counts —
# and only in the workload namespace. It cannot touch itself, the console,
# or the observability stack.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pulseops-chaos
  namespace: pulseops
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, delete]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pulseops-chaos
  namespace: pulseops
subjects:
  - {kind: ServiceAccount, name: controlplane, namespace: pulseops-system}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: pulseops-chaos}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: controlplane-config
  namespace: pulseops-system
data:
  RUNTIME_MODE: kubernetes
  TARGET_NAMESPACE: pulseops
  PROMETHEUS_URL: http://prometheus.pulseops-observability:9090
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger.pulseops-observability:4318
  CHAOS_ENABLED: "true"
  # browser-facing links shown in the console (overridden per environment)
  GRAFANA_URL: http://localhost:3000
  PROMETHEUS_PUBLIC_URL: http://localhost:9090
  JAEGER_URL: http://localhost:16686
  ALERTMANAGER_URL: http://localhost:9093
---
apiVersion: v1
kind: Secret
metadata:
  name: controlplane-secrets
  namespace: pulseops-system
type: Opaque
stringData:
  # must match shop-secrets FAULT_ADMIN_TOKEN
  FAULT_ADMIN_TOKEN: demo-fault-token
  # set to require X-PulseOps-Token on chaos actions
  CONTROL_PLANE_TOKEN: ""
---
apiVersion: v1
kind: Service
metadata:
  name: controlplane
  namespace: pulseops-system
  labels: {app.kubernetes.io/name: controlplane, app.kubernetes.io/part-of: pulseops-platform}
spec:
  selector: {app.kubernetes.io/name: controlplane}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controlplane
  namespace: pulseops-system
  labels: {app.kubernetes.io/name: controlplane, app.kubernetes.io/part-of: pulseops-platform}
spec:
  # single replica: experiment history and received alerts live in memory
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: controlplane}
  template:
    metadata:
      labels: {app.kubernetes.io/name: controlplane, app.kubernetes.io/part-of: pulseops-platform}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8000"}
    spec:
      serviceAccountName: controlplane
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: controlplane
          image: pulseops/controlplane
          ports: [{name: http, containerPort: 8000}]
          envFrom:
            - configMapRef: {name: controlplane-config}
            - secretRef: {name: controlplane-secrets}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
