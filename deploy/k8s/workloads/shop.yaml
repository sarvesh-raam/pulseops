apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: pulseops
  labels: {app.kubernetes.io/name: loadgen, app.kubernetes.io/part-of: pulseops}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: loadgen}
  template:
    metadata:
      labels: {app.kubernetes.io/name: loadgen, app.kubernetes.io/part-of: pulseops}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "9100"}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: loadgen
          image: pulseops/loadgen
          command: [python, -m, loadgen.main]
          env:
            - name: GATEWAY_URL
              valueFrom: {configMapKeyRef: {name: shop-config, key: GATEWAY_URL}}
            - {name: REQUESTS_PER_SEC, value: "8"}
          ports: [{name: metrics, containerPort: 9100}]
          livenessProbe:
            httpGet: {path: /metrics, port: metrics}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
