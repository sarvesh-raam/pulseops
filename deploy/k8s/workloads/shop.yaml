# Generated layout, one block per service: Service + Deployment + PDB (+ HPA).
# Self-healing at the platform layer, per service:
#   - replicas >= 2 and a PDB: killing one pod never takes the service down
#   - readinessProbe /readyz: a pod is only in the Service while it can serve
#   - livenessProbe /healthz: a wedged process is restarted
#   - preStop sleep: endpoints are removed before the process stops
#   - HPA: scales out under load
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: pulseops
  labels: {app.kubernetes.io/name: gateway, app.kubernetes.io/part-of: pulseops}
spec:
  selector: {app.kubernetes.io/name: gateway}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: pulseops
  labels: {app.kubernetes.io/name: gateway, app.kubernetes.io/part-of: pulseops}
spec:
  replicas: 2
  strategy: {rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector:
    matchLabels: {app.kubernetes.io/name: gateway}
  template:
    metadata:
      labels: {app.kubernetes.io/name: gateway, app.kubernetes.io/part-of: pulseops}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8000"}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app.kubernetes.io/name: gateway}}
      containers:
        - name: gateway
          image: pulseops/gateway
          ports: [{name: http, containerPort: 8000}]
          env:
            - name: LOG_LEVEL
              valueFrom: {configMapKeyRef: {name: shop-config, key: LOG_LEVEL}}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom: {configMapKeyRef: {name: shop-config, key: OTEL_EXPORTER_OTLP_ENDPOINT}}
            - name: ORDERS_URL
              valueFrom: {configMapKeyRef: {name: shop-config, key: ORDERS_URL}}
            - name: INVENTORY_URL
              valueFrom: {configMapKeyRef: {name: shop-config, key: INVENTORY_URL}}
            - name: FAULT_ADMIN_TOKEN
              valueFrom: {secretKeyRef: {name: shop-secrets, key: FAULT_ADMIN_TOKEN}}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 1
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop: {exec: {command: [sleep, "3"]}}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway
  namespace: pulseops
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: gateway}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
  namespace: pulseops
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: gateway}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
---
