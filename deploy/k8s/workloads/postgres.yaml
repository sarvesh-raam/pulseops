# Single-replica Postgres: deliberately a hard dependency, so killing it is
# the "big" chaos experiment. The StatefulSet controller recreates the pod
# on the same volume; every service's connection pool reconnects with backoff.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: pulseops
  labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: pulseops}
spec:
  selector: {app.kubernetes.io/name: postgres}
  ports: [{name: pg, port: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: pulseops
  labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: pulseops}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: pulseops}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70  # postgres user in the alpine image
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_USER, value: pulseops}
            - {name: POSTGRES_DB, value: pulseops}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: shop-secrets, key: POSTGRES_PASSWORD}}
          ports: [{name: pg, containerPort: 5432}]
          readinessProbe:
            exec: {command: [pg_isready, -U, pulseops, -d, pulseops]}
            periodSeconds: 2
          livenessProbe:
            exec: {command: [pg_isready, -U, pulseops, -d, pulseops]}
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
      volumes:
        - {name: run, emptyDir: {}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 2Gi}}
