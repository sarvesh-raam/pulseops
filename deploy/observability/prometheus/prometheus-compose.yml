global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files: [/etc/prometheus/alerts.yml]

alerting:
  alertmanagers:
    - static_configs: [{targets: ["alertmanager:9093"]}]

scrape_configs:
  # Docker's DNS returns one A record per replica, so every container of a
  # scaled service is scraped individually.
  - job_name: services
    dns_sd_configs:
      - names: [gateway, orders, inventory, payments, controlplane]
        type: A
        port: 8000
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: job

  - job_name: loadgen
    dns_sd_configs:
      - names: [loadgen]
        type: A
        port: 9100
        refresh_interval: 5s
