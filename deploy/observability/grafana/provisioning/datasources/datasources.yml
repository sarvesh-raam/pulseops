apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: ${PROMETHEUS_URL}
    isDefault: true
    jsonData:
      exemplarTraceIdDestinations:
        - {name: trace_id, datasourceUid: jaeger}

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: ${LOKI_URL}
    jsonData:
      # every JSON log line carries trace_id -> one click to the trace
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: jaeger
          url: "$${__value.raw}"
          urlDisplayLabel: View trace

  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: ${JAEGER_URL}
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        filterByTraceID: true
        customQuery: true
        query: '{service="$${__span.tags["service.name"]}"} | trace_id="$${__trace.traceId}"'
