# Dev/test tooling for all services (each image only installs ../common).
[project]
name = "pulseops-services-dev"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["common", "gateway", "orders", "inventory", "payments", "loadgen", "controlplane"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "B008", "UP017", "ASYNC109"]

[tool.ruff.lint.isort]
known-first-party = ["pulseops_common", "gateway", "orders", "inventory", "payments", "loadgen", "controlplane"]
