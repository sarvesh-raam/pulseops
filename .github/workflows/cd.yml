name: CD

# Runs after CI succeeds on main: publishes images to GHCR, then (if a
# cluster is configured) migrates the database and rolls the new version out.
#
# Repository settings:
#   secrets.KUBE_CONFIG  base64-encoded kubeconfig for the target cluster
#                        (deploy job is skipped when unset)
#   vars.DEPLOY_ENABLED  set to "true" to enable the deploy job

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Publish images
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {name: pulseops-backend, context: backend}
          - {name: pulseops-frontend, context: frontend}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Image name (GHCR requires lowercase)
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.event.workflow_run.head_sha || github.sha }}
            ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy to Kubernetes
    needs: publish
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: Pin images to this commit
        working-directory: k8s/base
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          kustomize edit set image \
            "pulse-backend=ghcr.io/${OWNER}/pulseops-backend:${SHA}" \
            "pulse-frontend=ghcr.io/${OWNER}/pulseops-frontend:${SHA}"
      - name: Run migrations
        run: |
          # Jobs are immutable: replace the previous migration run
          kubectl -n pulse delete job pulse-migrate --ignore-not-found
          kubectl apply -k k8s/base
          kubectl -n pulse wait --for=condition=complete job/pulse-migrate --timeout=300s
      - name: Wait for rollout
        run: |
          for d in pulse-api pulse-scheduler pulse-worker pulse-frontend; do
            kubectl -n pulse rollout status deployment/$d --timeout=300s
          done
      - name: Smoke test
        run: |
          # (an ad-hoc `kubectl run` pod would be rejected by the namespace's
          # restricted Pod Security level; the API image already has curl)
          kubectl -n pulse exec deploy/pulse-api -- curl -fsS http://localhost:8000/readyz
          kubectl -n pulse exec deploy/pulse-api -- curl -fsS http://frontend/nginx-health
      - name: Roll back on failure
        if: failure()
        run: |
          for d in pulse-api pulse-scheduler pulse-worker pulse-frontend; do
            kubectl -n pulse rollout undo deployment/$d || true
          done
